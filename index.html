<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmpatIA - tablero por marca</title>
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    <meta name="description" content="Cada marca contra su categoria, su industria y el estudio completo: perfil de atributos, recorrido, publicos y posicionamiento. Un estudio de dobleA y Better Brands.">
<meta name="theme-color" content="#5B2EFF">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<meta property="og:type" content="website">
<meta property="og:title" content="EmpatIA - tablero por marca">
<meta property="og:description" content="Cada marca contra su categoria, su industria y el estudio completo: perfil de atributos, recorrido, publicos y posicionamiento. Un estudio de dobleA y Better Brands.">
<meta property="og:url" content="https://mebucca.github.io/empatIA-dashboard-marca/">
<meta property="og:image" content="https://mebucca.github.io/empatIA-dashboard-marca/favicon-180.png">
<meta name="twitter:card" content="summary">

<style>
  #cargando {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    background: linear-gradient(160deg, #F3F0FF, #FFFFFF 60%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: opacity .35s ease;
  }
  #cargando.lista { opacity: 0; pointer-events: none; }
  #cargando img { height: 38px; width: auto; }
  #cargando .titulo { margin: 0; font-size: 1.6rem; font-weight: 700; color: #2B2350; }
  #cargando .detalle {
    margin: 0; max-width: 34rem; font-size: .95rem; line-height: 1.6; color: #5A5478;
  }
  #cargando .barra {
    width: min(260px, 70vw); height: 4px; border-radius: 999px;
    background: #E6E0FA; overflow: hidden;
  }
  #cargando .barra span {
    display: block; width: 40%; height: 100%; border-radius: 999px;
    background: #5B2EFF; animation: avanza 1.4s ease-in-out infinite;
  }
  @keyframes avanza {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
  @media (prefers-reduced-motion: reduce) {
    #cargando .barra span { animation: none; width: 100%; }
  }
</style>
  </head>
  <body>
    
<div id="cargando">
  <img src="logo_dobleAA.png" alt="dobleA" width="152" height="56">
  <p class="titulo">EmpatIA</p>
  <p class="detalle">Preparando el tablero. La primera visita tarda unos
     segundos: el estudio completo se descarga al navegador y desde ahi todo
     responde al instante.</p>
  <div class="barra"><span></span></div>
</div>
<script>
  (function () {
    var quitar = function () {
      var pantalla = document.getElementById("cargando");
      if (!pantalla) return;
      pantalla.classList.add("lista");
      setTimeout(function () { pantalla.remove(); }, 400);
    };
    document.addEventListener("shiny:connected", quitar);
    // Respaldo: si el evento no llegara, la espera no se queda pegada encima
    // de una aplicacion que ya cargo.
    setTimeout(quitar, 60000);
  })();
</script>
    <div style="height: 100vh; width: 100vw" id="root"></div>
    
  </body>
</html>
